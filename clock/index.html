<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>13 mini · 极简时钟</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.screen{width:100%;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);text-align:center}
.time{font-size:clamp(76px,22vw,126px);font-weight:200;letter-spacing:-.085em;font-variant-numeric:tabular-nums;line-height:1}
.date{margin-top:24px;font-size:17px;font-weight:400;letter-spacing:.08em;color:#8e8e93}
.line{width:34px;height:1px;background:#48484a;margin:30px auto 0}
.hint{margin-top:22px;color:#636366;font-size:10px;letter-spacing:.22em;text-transform:uppercase}
@media (orientation:landscape){.time{font-size:min(23vw,150px)}.date{margin-top:14px}.line{margin-top:18px}.hint{margin-top:12px}}
</style>
</head>
<body>
<main class="screen">
<div class="time" id="time">20:00</div>
<div class="date" id="date">星期一 · 11月24日</div>
<div class="line"></div>
<div class="hint">TIME · DATE</div>
</main>
<script>
const el=id=>document.getElementById(id);
function tick(){
 const d=new Date();
 el('time').textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
 el('date').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long',month:'long',day:'numeric'}).format(d).replace(' ',' · ');
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
